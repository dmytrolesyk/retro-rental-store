services:
  init-secrets:
    build:
      context: .
      dockerfile: bootstrap.Dockerfile
    volumes:
      - app_credentials:/run/secrets

  node:
    profiles: [app]
    build:
      context: .
      dockerfile: node.Dockerfile
    environment:
      PORT: ${PORT:-3000}
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: app_user
      PG_DB: rental
      PG_PASSWORD_FILE: /run/secrets/app_pg_password
    volumes:
      - app_credentials:/run/secrets:ro
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: pg.Dockerfile
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_dev
      POSTGRES_DB: rental
      MIGRATION_USER: migration_user
      MIGRATION_PASSWORD: migration_dev
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - data_typeorm:/var/lib/postgresql
      - app_credentials:/run/secrets:ro
      - ./db/fixtures/retronian:/fixtures/retronian:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U admin -d rental']
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      init-secrets:
        condition: service_completed_successfully

  rotator:
    build:
      context: .
      dockerfile: rotator.Dockerfile
    environment:
      PGHOST: db
      PGUSER: admin
      PGDATABASE: rental
      PGPASSWORD: admin_dev
      ROTATE_INTERVAL: ${ROTATE_INTERVAL:-86400}
    volumes:
      - app_credentials:/run/secrets
    depends_on:
      db:
        condition: service_healthy

volumes:
  data_typeorm:
  app_credentials:
