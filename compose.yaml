services:
  init-secrets:
    build:
      context: .
      dockerfile: bootstrap.Dockerfile
    volumes:
      - app_credentials:/run/secrets

  node:
    build:
      context: .
      dockerfile: node.Dockerfile
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_USER: ${DB_APP_USER:-db_app}
      DB_NAME: rental
      DB_PASSWORD_FILE: ${DB_APP_PASSWORD_FILE:-/run/secrets/db_app_password}
    volumes:
      - app_credentials:/run/secrets:ro
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    depends_on:
      pgbouncer:
        condition: service_healthy

  pooler-auth:
    image: postgres:18
    entrypoint: ['bash', '/opt/init-auth.sh']
    environment:
      PGHOST: db
      PGUSER: ${DB_ADMIN_USER:-db_admin}
      PGDATABASE: rental
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-admin_dev}
      DB_APP_USER: ${DB_APP_USER:-db_app}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-db_migrator}
    volumes:
      - app_credentials:/run/secrets:ro
      - ./pgbouncer/init-auth.sh:/opt/init-auth.sh:ro
    depends_on:
      db:
        condition: service_healthy

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    entrypoint: ['sh', '/opt/start-pgbouncer.sh']
    environment:
      # Reuse the existing local admin credential for the pooler console only.
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-admin_dev}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/start.sh:/opt/start-pgbouncer.sh:ro
      - app_credentials:/run/secrets:ro
    ports:
      - '127.0.0.1:${PGBOUNCER_PORT:-6432}:6432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'psql -XAt -h 127.0.0.1 -p 6432 -U pgbouncer_admin -d pgbouncer -c "SHOW VERSION" >/dev/null',
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      pooler-auth:
        condition: service_completed_successfully

  db:
    build:
      context: .
      dockerfile: pg.Dockerfile
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-db_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-admin_dev}
      POSTGRES_DB: rental
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-db_migrator}
      DB_APP_USER: ${DB_APP_USER:-db_app}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-migration_dev}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - data_typeorm:/var/lib/postgresql
      - app_credentials:/run/secrets:ro
      - ./db/fixtures/retronian:/fixtures/retronian:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      init-secrets:
        condition: service_completed_successfully

  rotator:
    build:
      context: .
      dockerfile: rotator.Dockerfile
    environment:
      PGHOST: db
      PGUSER: ${DB_ADMIN_USER:-db_admin}
      PGDATABASE: rental
      PGPASSWORD: ${DB_ADMIN_PASSWORD:-admin_dev}
      DB_APP_USER: ${DB_APP_USER:-db_app}
      ROTATE_INTERVAL: ${ROTATE_INTERVAL:-86400}
    volumes:
      - app_credentials:/run/secrets
    depends_on:
      db:
        condition: service_healthy

  broker-db:
    profiles: [contract]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker_local
      POSTGRES_DB: broker
    volumes:
      - broker_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U broker -d broker']
      interval: 2s
      timeout: 3s
      retries: 30

  pact-broker:
    profiles: [contract]
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker_local@broker-db/broker
      PACT_BROKER_ALLOW_PUBLIC_READ: 'true'
    ports:
      - '127.0.0.1:${PACT_BROKER_PORT:-9292}:9292'
    depends_on:
      broker-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  broker_data:
  data_typeorm:
  app_credentials:
