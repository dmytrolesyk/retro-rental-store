[databases]
; Preserve the client role: SCRAM passthrough must not use a forced user=.
rental = host=db port=5432 dbname=rental

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer-userlist.txt
auth_user = db_pool_auth
auth_dbname = rental
auth_query = SELECT username, password FROM pgbouncer.user_lookup($1)

pool_mode = transaction
default_pool_size = 5
max_client_conn = 100
max_prepared_statements = 200
admin_users = pgbouncer_admin
server_connect_timeout = 3
query_wait_timeout = 10
ignore_startup_parameters = extra_float_digits
