openapi: 3.0.0
paths:
  /games:
    get:
      operationId: listGames
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of items per page.
        - name: cursor
          required: false
          in: query
          description: Opaque token from next_cursor. Pass it unchanged; do not parse or
            construct it. A token belongs to one resource. Omit for the first
            page.
          schema:
            type: string
      responses:
        "200":
          description: One page of games.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePageDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      summary: List games in stable UUID order
      tags: &a1
        - games
  /games/{gameId}:
    get:
      operationId: getGame
      parameters:
        - name: gameId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Game details and platform identifiers for checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetailDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      summary: Get a game and its platforms
      tags: *a1
  /rentals:
    post:
      operationId: createRental
      parameters:
        - name: Idempotency-Key
          in: header
          description: Client-generated opaque key. The same key and validated body replay
            the original 201 response and Location, without another booking. No
            payment is taken at booking. A legacy checkout key returns 409; use
            a new key. JSON property order and UUID case do not affect identity.
            A different body with the same key returns 422. Keys are stored in
            PostgreSQL without automatic expiration.
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[!-~]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRentalDto"
      responses:
        "201":
          description: Booking created, or its original BOOKED receipt replayed regardless
            of the current lifecycle state.
          headers:
            Location:
              description: URL of the created rental.
              schema:
                type: string
                format: uri-reference
            Idempotency-Replay:
              description: Whether this is the persisted original response.
              schema:
                type: string
                enum:
                  - "true"
                  - "false"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedRentalDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Access forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Business state conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Idempotency key used with a different request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: &a2
        - bearer: []
      summary: Reserve one available copy for 24 hours without payment
      tags: &a3
        - rentals
    get:
      operationId: listRentals
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of items per page.
        - name: cursor
          required: false
          in: query
          description: Opaque token from next_cursor. Pass it unchanged; do not parse or
            construct it. A token belongs to one resource. Omit for the first
            page.
          schema:
            type: string
      responses:
        "200":
          description: One page of rental summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalPageDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: *a2
      summary: List rentals in stable UUID order
      tags: *a3
  /rentals/{rentalId}/issue:
    post:
      operationId: issueRental
      parameters:
        - name: rentalId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Issued rental; repeated issue while ACTIVE returns the current
            state without charging again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalDetailDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Access forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Business state conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: *a2
      summary: Staff issues a booked copy and charges its fixed price once
      tags: *a3
  /rentals/{rentalId}/cancel:
    post:
      operationId: cancelRental
      parameters:
        - name: rentalId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRentalDto"
      responses:
        "200":
          description: Cancelled booking; repeat preserves the first cancellation reason
            and actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalDetailDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Access forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Business state conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: *a2
      summary: Owner or staff cancels a booking and releases the reserved copy
      tags: *a3
  /rentals/{rentalId}/return:
    post:
      operationId: returnRental
      parameters:
        - name: rentalId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Completed rental; repeat preserves physical return dates.
            Historical partial returns remain unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalDetailDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Access forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Business state conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: *a2
      summary: Staff accepts all outstanding copies and completes the rental
      tags: *a3
  /rentals/{rentalId}:
    get:
      operationId: getRental
      parameters:
        - name: rentalId
          required: true
          in: path
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rental details with historical item prices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalDetailDto"
        "400":
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Access forbidden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: *a2
      summary: Get a rental and its items
      tags: *a3
info:
  title: Retro Games Rental API
  description: Catalog and single-copy booking/rental API. Monetary amounts are
    integer kopecks. Rental operations require configured opaque Bearer
    credentials; the game catalog is public.
  version: 1.0.0
  contact: {}
tags:
  - name: games
    description: Game catalog and supported platforms.
  - name: rentals
    description: Reserve for 24 hours; staff issues for one paid day, accepts
      returns, or cancels bookings.
servers:
  - url: http://localhost:3000
    description: Local server; override the URL for your deployment.
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: opaque
      type: http
      description: Configured opaque token (not a JWT).
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: urn:retro-rental:problem:bad-request
        title:
          type: string
          example: bad request
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 400
        detail:
          type: string
          example: Invalid UUID
        instance:
          type: string
          format: uri-reference
          example: /rentals
      required:
        - type
        - title
        - status
        - detail
        - instance
    GameSummaryDto:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        name:
          type: string
        nameUk:
          type: string
        releaseDate:
          type: string
          nullable: true
          format: date
        gameCoverUrl:
          type: string
          nullable: true
      required:
        - gameId
        - name
        - nameUk
        - releaseDate
        - gameCoverUrl
    GamePageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GameSummaryDto"
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page; null when there are no more items.
      required:
        - items
        - next_cursor
    GamePlatformDto:
      type: object
      properties:
        platformId:
          type: string
          format: uuid
        name:
          type: string
      required:
        - platformId
        - name
    GameDetailDto:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        name:
          type: string
        nameUk:
          type: string
        releaseDate:
          type: string
          nullable: true
          format: date
        gameCoverUrl:
          type: string
          nullable: true
        description:
          type: string
        descriptionUk:
          type: string
        platforms:
          type: array
          items:
            $ref: "#/components/schemas/GamePlatformDto"
      required:
        - gameId
        - name
        - nameUk
        - releaseDate
        - gameCoverUrl
        - description
        - descriptionUk
        - platforms
    CreateRentalDto:
      type: object
      properties:
        renterId:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        platformId:
          type: string
          format: uuid
      required:
        - renterId
        - gameId
        - platformId
      additionalProperties: false
    CreatedRentalDto:
      type: object
      properties:
        rentalId:
          type: string
          format: uuid
        gameCopyId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - BOOKED
        bookedAt:
          type: string
          format: date-time
        bookingExpiresAt:
          type: string
          format: date-time
        costPerDay:
          type: integer
          minimum: 0
          description: Price fixed at booking, charged for one day at issue, in kopecks.
      required:
        - rentalId
        - gameCopyId
        - status
        - bookedAt
        - bookingExpiresAt
        - costPerDay
    RentalItemDto:
      type: object
      properties:
        gameCopyId:
          type: string
          format: uuid
        costPerDay:
          type: integer
          minimum: 0
          description: Historical price per day in kopecks.
        releasedAt:
          type: string
          nullable: true
          format: date-time
        returnedAt:
          type: string
          nullable: true
          format: date-time
      required:
        - gameCopyId
        - costPerDay
        - releasedAt
        - returnedAt
    RentalDetailDto:
      type: object
      properties:
        status:
          type: string
          enum: &a4
            - BOOKED
            - ACTIVE
            - OVERDUE
            - RETURNED
            - CANCELLED
        bookedAt:
          type: string
          format: date-time
          nullable: true
        bookingExpiresAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        rentalId:
          type: string
          format: uuid
        renterId:
          type: string
          format: uuid
        rentedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelledBy:
          type: string
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/RentalItemDto"
      required:
        - status
        - bookedAt
        - bookingExpiresAt
        - dueAt
        - rentalId
        - renterId
        - rentedAt
        - cancelledAt
        - cancelledBy
        - cancellationReason
        - items
    CancelRentalDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Nonblank reason for cancellation before issue.
      required:
        - reason
      additionalProperties: false
    RentalSummaryDto:
      type: object
      properties:
        status:
          type: string
          enum: *a4
        bookedAt:
          type: string
          format: date-time
          nullable: true
        bookingExpiresAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        rentalId:
          type: string
          format: uuid
        renterId:
          type: string
          format: uuid
        rentedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - status
        - bookedAt
        - bookingExpiresAt
        - dueAt
        - rentalId
        - renterId
        - rentedAt
    RentalPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RentalSummaryDto"
        next_cursor:
          type: string
          nullable: true
          description: Opaque token for the next page; null when there are no more items.
      required:
        - items
        - next_cursor
security: []
